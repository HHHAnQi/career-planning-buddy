name: career-planning-buddy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-career_buddy}
      POSTGRES_USER: ${POSTGRES_USER:-career_buddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_buddy_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-Career Planning Buddy}
      APP_ENV: ${APP_ENV:-development}
      APP_GIT_COMMIT: ${APP_GIT_COMMIT:-unknown}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-career_buddy}:${POSTGRES_PASSWORD:-career_buddy_local}@postgres:5432/${POSTGRES_DB:-career_buddy}
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-random-characters}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      JWT_ISSUER: ${JWT_ISSUER:-career-planning-buddy}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-5173}","http://127.0.0.1:${FRONTEND_PORT:-5173}"]'
      AGENT_GRAPH_VERSION: ${AGENT_GRAPH_VERSION:-stage6b-v1}
      AGENT_FEATURE_STAGE: ${AGENT_FEATURE_STAGE:-6}
      AGENT_DEADLINE_SECONDS: ${AGENT_DEADLINE_SECONDS:-45}
      AGENT_MAX_TOOL_ROUNDS: ${AGENT_MAX_TOOL_ROUNDS:-2}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-4}
      AGENT_MAX_LLM_CALLS: ${AGENT_MAX_LLM_CALLS:-7}
      AGENT_MAX_TOTAL_TOKENS: ${AGENT_MAX_TOTAL_TOKENS:-16000}
      AGENT_MAX_INPUT_TOKENS_PER_CALL: ${AGENT_MAX_INPUT_TOKENS_PER_CALL:-6000}
      AGENT_MAX_OUTPUT_TOKENS_PER_CALL: ${AGENT_MAX_OUTPUT_TOKENS_PER_CALL:-1500}
      AGENT_POLL_INTERVAL_SECONDS: ${AGENT_POLL_INTERVAL_SECONDS:-0.05}
      AGENT_HEARTBEAT_SECONDS: ${AGENT_HEARTBEAT_SECONDS:-15}
      AGENT_LEASE_SECONDS: ${AGENT_LEASE_SECONDS:-45}
      AGENT_MAX_RUN_ATTEMPTS: ${AGENT_MAX_RUN_ATTEMPTS:-3}
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-2}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      LLM_STREAMING_ENABLED: ${LLM_STREAMING_ENABLED:-false}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-mock}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-8}
      RAG_MIN_RERANK_SCORE: ${RAG_MIN_RERANK_SCORE:-0.05}
      TOOL_TIMEOUT_SECONDS: ${TOOL_TIMEOUT_SECONDS:-8}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_PROVIDER_NAME: ${LLM_PROVIDER_NAME:-auto}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PLANNING_MODEL: ${LLM_PLANNING_MODEL:-}
      LLM_GOAL_UNDERSTANDING_MODEL: ${LLM_GOAL_UNDERSTANDING_MODEL:-}
      LLM_EVIDENCE_DISTILLATION_MODEL: ${LLM_EVIDENCE_DISTILLATION_MODEL:-}
      LLM_PLANNING_REASONING: ${LLM_PLANNING_REASONING:-off}
      LLM_GOAL_UNDERSTANDING_REASONING: ${LLM_GOAL_UNDERSTANDING_REASONING:-off}
      LLM_EVIDENCE_DISTILLATION_REASONING: ${LLM_EVIDENCE_DISTILLATION_REASONING:-off}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      ASR_PROVIDER: ${ASR_PROVIDER:-mock}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_MODEL: ${ASR_MODEL:-whisper-1}
      ASR_TIMEOUT_SECONDS: ${ASR_TIMEOUT_SECONDS:-30}
      ASR_MAX_AUDIO_BYTES: ${ASR_MAX_AUDIO_BYTES:-5000000}
      ASR_MAX_DURATION_SECONDS: ${ASR_MAX_DURATION_SECONDS:-120}
      EVAL_PROVIDER_MODE: ${EVAL_PROVIDER_MODE:-mock}
      EVAL_AUDIT_LIVE_CALLS: ${EVAL_AUDIT_LIVE_CALLS:-true}
      EVAL_PROVIDER_SEED_MODE: ${EVAL_PROVIDER_SEED_MODE:-provider_seed}
      EVAL_LIVE_MAX_ATTEMPTS: ${EVAL_LIVE_MAX_ATTEMPTS:-3}
      EVAL_LIVE_RETRY_BASE_SECONDS: ${EVAL_LIVE_RETRY_BASE_SECONDS:-1}
      EVAL_LIVE_RETRY_MAX_SECONDS: ${EVAL_LIVE_RETRY_MAX_SECONDS:-8}
      EVAL_TRIAL_CONCURRENCY: ${EVAL_TRIAL_CONCURRENCY:-1}
      EVAL_LIVE_CONCURRENCY: ${EVAL_LIVE_CONCURRENCY:-2}
      EVAL_LIVE_PACING_SECONDS: ${EVAL_LIVE_PACING_SECONDS:-0.5}
      EVAL_PAIR_SMOKE_PLANNING_PROFILE: ${EVAL_PAIR_SMOKE_PLANNING_PROFILE:-}
      JUDGE_LLM_PROVIDER: ${JUDGE_LLM_PROVIDER:-fixture}
      JUDGE_LLM_API_KEY: ${JUDGE_LLM_API_KEY:-}
      JUDGE_LLM_BASE_URL: ${JUDGE_LLM_BASE_URL:-}
      JUDGE_LLM_MODEL: ${JUDGE_LLM_MODEL:-}
      JUDGE_LLM_TIMEOUT_SECONDS: ${JUDGE_LLM_TIMEOUT_SECONDS:-60}
      JUDGE_LLM_MAX_OUTPUT_TOKENS: ${JUDGE_LLM_MAX_OUTPUT_TOKENS:-4096}
      JUDGE_LLM_TEMPERATURE: ${JUDGE_LLM_TEMPERATURE:-0}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-mock}
      BAIDU_SEARCH_API_KEY: ${BAIDU_SEARCH_API_KEY:-}
      BAIDU_SEARCH_BASE_URL: ${BAIDU_SEARCH_BASE_URL:-https://qianfan.baidubce.com/v2/ai_search/web_search}
      BAIDU_SEARCH_EDITION: ${BAIDU_SEARCH_EDITION:-lite}
      BAIDU_SEARCH_MAX_RESULTS: ${BAIDU_SEARCH_MAX_RESULTS:-5}
      BAIDU_SEARCH_TIMEOUT_SECONDS: ${BAIDU_SEARCH_TIMEOUT_SECONDS:-10}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      MEMORY_SEMANTIC_RETRIEVAL_ENABLED: ${MEMORY_SEMANTIC_RETRIEVAL_ENABLED:-true}
      MEMORY_RETRIEVAL_LIMIT: ${MEMORY_RETRIEVAL_LIMIT:-8}
      MEMORY_CONTEXT_MAX_ITEMS: ${MEMORY_CONTEXT_MAX_ITEMS:-5}
      MEMORY_CONTEXT_MAX_CHARS: ${MEMORY_CONTEXT_MAX_CHARS:-1200}
      MEMORY_MIN_SIMILARITY: ${MEMORY_MIN_SIMILARITY:-0.35}
      MEMORY_RECENCY_HALF_LIFE_DAYS: ${MEMORY_RECENCY_HALF_LIFE_DAYS:-14}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.35}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
